name: macos-build
on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths-ignore: &docs-only
      - "**/*.md"
      - "docs/**"
      - "tools/**"
      - "LICENSE"
      - ".cursor/**"
      - ".codex/**"
      - ".vscode/**"
      - ".clang-format"
      - ".clangd"
  push:
    branches: [dev]
    paths-ignore: *docs-only

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Match the native Apple Silicon / Metal 26 development environment.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      VULKAN_SDK_VERSION: "1.4.363.0"
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      CARGO_BUILD_JOBS: "1"
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install build tools
        id: tools
        run: |
          brew install llvm ispc cmake ninja
          llvm_root="$(brew --prefix llvm)"
          echo "LLVM_ROOT=$llvm_root" >> "$GITHUB_ENV"
          echo "$llvm_root/bin" >> "$GITHUB_PATH"
          echo "XMAKE_GLOBALDIR=$RUNNER_WORKSPACE/xmake-global" >> "$GITHUB_ENV"
          "$llvm_root/bin/clang++" --version
          ispc --version
          cargo --version
          echo "llvm=$("$llvm_root/bin/clang++" -dumpversion)" >> "$GITHUB_OUTPUT"
          echo "rust=$(rustc --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # Headers/Loader alone are insufficient: the engine also links Slang and
      # SPIRV-Cross. Install the complete prebuilt SDK, including those libraries.
      - name: Install Vulkan SDK
        # v1.2 predates the vulkansdk-macOS-<version>.app installer layout.
        uses: humbletim/install-vulkan-sdk@e7d6e7b937bde4503c7ba5c9584c9dc68f44c4b8
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true

      - name: Check SDK components
        run: |
          test -f "$VULKAN_SDK/include/vulkan/vulkan.cppm"
          test -f "$VULKAN_SDK/include/slang/slang.h"
          test -f "$VULKAN_SDK/lib/libslang.dylib"
          for component in core glsl msl; do
            test -f "$VULKAN_SDK/lib/libspirv-cross-$component.a"
          done

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: L-Sun/xmake#branch@hitagi-engine
          actions-cache-folder: ".xmake-cache"

      - name: Restore xmake packages
        id: restore-packages
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.XMAKE_GLOBALDIR }}/.xmake/packages
          key: xmake-packages-macos-26-${{ runner.arch }}-release-llvm${{ steps.tools.outputs.llvm }}-rust${{ steps.tools.outputs.rust }}-sdk${{ env.VULKAN_SDK_VERSION }}-${{ hashFiles('.github/workflows/macos.yaml', 'xmake.lua', 'hitagi/**/xmake.lua', 'xmake/**') }}

      - name: Configure
        run: |
          # Native clang preserves its default macOS target; the llvm toolchain
          # injects Xcode target flags and is not equivalent for C++23 modules.
          xmake f -y -p macosx -a arm64 -m release --toolchain=clang \
            --cc="$LLVM_ROOT/bin/clang" --cxx="$LLVM_ROOT/bin/clang++" \
            --ispc=y --profile=n --benchmarks=n

      - name: Save xmake packages
        if: ${{ success() && steps.restore-packages.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.XMAKE_GLOBALDIR }}/.xmake/packages
          key: ${{ steps.restore-packages.outputs.cache-primary-key }}

      - name: Build libraries, tests and examples
        run: xmake -vD -j 3
