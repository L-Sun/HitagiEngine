name: windows-build
on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths-ignore: &docs-only
      - "**/*.md"
      - "docs/**"
      - "tools/**"
      - "LICENSE"
      - ".cursor/**"
      - ".codex/**"
      - ".vscode/**"
      - ".clang-format"
      - ".clangd"
  push:
    branches: [dev]
    paths-ignore: *docs-only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      # Keep the package root short; USD install paths are long on Windows.
      XMAKE_GLOBALDIR: ${{ runner.workspace }}/xmake-global

    strategy:
      matrix:
        os: [windows-latest]
        compiler: ["--toolchain=clang-cl", "--toolchain=msvc"]

    steps:
      - uses: actions/checkout@v4

      - name: Download ISPC (Windows)
        run: |
          Invoke-WebRequest -Uri "https://github.com/ispc/ispc/releases/download/v1.27.0/ispc-v1.27.0-windows.zip" -OutFile "ispc.zip"
          7z x ispc.zip
          "ispc-v1.27.0-windows/bin" >> $env:GITHUB_PATH

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: L-Sun/xmake#branch@hitagi-engine
          actions-cache-folder: ".xmake-cache"

      - name: Restore xmake packages
        id: restore-packages
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.XMAKE_GLOBALDIR }}/.xmake/packages
          key: xmake-packages-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('xmake.lua', 'hitagi/**/xmake.lua', 'examples/**/xmake.lua', 'xmake/packages/**') }}
          restore-keys: |
            xmake-packages-${{ runner.os }}-${{ matrix.compiler }}-

      - name: Config
        run: |
          xmake f -y -a x64 -m release ${{ matrix.compiler }}

      - name: Save xmake packages
        if: ${{ !cancelled() && steps.restore-packages.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.XMAKE_GLOBALDIR }}/.xmake/packages
          key: ${{ steps.restore-packages.outputs.cache-primary-key }}

      - name: Build
        run: |
          xmake -vD
