name: windows-build
on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths-ignore: &docs-only
      - "**/*.md"
      - "docs/**"
      - "tools/**"
      - "LICENSE"
      - ".cursor/**"
      - ".codex/**"
      - ".vscode/**"
      - ".clang-format"
      - ".clangd"
  push:
    branches: [dev]
    paths-ignore: *docs-only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      LLVM_VERSION: "23.1.2"

    strategy:
      matrix:
        os: [windows-latest]
        compiler: ["--toolchain=clang-cl", "--toolchain=msvc"]

    steps:
      - uses: actions/checkout@v4

      # Keep the package root short; USD install paths are long on Windows.
      - name: Set xmake global directory
        run: |
          "XMAKE_GLOBALDIR=$env:RUNNER_WORKSPACE\xmake-global" >> $env:GITHUB_ENV

      - name: Install LLVM
        if: ${{ matrix.compiler == '--toolchain=clang-cl' }}
        run: |
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.msi" -OutFile "llvm.msi"
          if (Test-Path "C:\Program Files\LLVM") { Remove-Item -Recurse -Force "C:\Program Files\LLVM" }
          $process = Start-Process msiexec.exe -ArgumentList "/i", "`"$((Resolve-Path llvm.msi).Path)`"", "/qn", "/norestart" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "LLVM installer failed with exit code $($process.ExitCode)" }
          $version = & "C:\Program Files\LLVM\bin\clang-cl.exe" --version
          $version
          if (-not ($version -match "clang version $([regex]::Escape($env:LLVM_VERSION))")) { throw "Unexpected clang-cl version" }

      - name: Download ISPC (Windows)
        run: |
          Invoke-WebRequest -Uri "https://github.com/ispc/ispc/releases/download/v1.27.0/ispc-v1.27.0-windows.zip" -OutFile "ispc.zip"
          7z x ispc.zip
          "ispc-v1.27.0-windows/bin" >> $env:GITHUB_PATH

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: L-Sun/xmake#branch@hitagi-engine
          actions-cache-folder: ".xmake-cache"

      - name: Restore xmake packages
        id: restore-packages
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.XMAKE_GLOBALDIR }}/.xmake/packages
          key: xmake-packages-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('xmake.lua', 'hitagi/**/xmake.lua', 'examples/**/xmake.lua', 'xmake/packages/**') }}
          restore-keys: |
            xmake-packages-${{ runner.os }}-${{ matrix.compiler }}-

      - name: Config
        run: |
          xmake f -y -a x64 -m release ${{ matrix.compiler }}

      - name: Save xmake packages
        if: ${{ !cancelled() && steps.restore-packages.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.XMAKE_GLOBALDIR }}/.xmake/packages
          key: ${{ steps.restore-packages.outputs.cache-primary-key }}

      - name: Build
        run: |
          xmake -vD
