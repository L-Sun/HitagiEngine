<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="830" viewBox="0 0 1360 830" role="img" aria-labelledby="title desc">
  <title id="title">Global Lookup · A Shared Table Between Caller and Service</title>
  <desc id="desc">Texture::DecodeCPU, GuiManager::LoadFont and GBuffer / DeferredLighting look up FileIOManager. World::Update looks up JobSystem. Editor / PbrDemo looks up AssetManager. sm_AllModules maps those names and Engine to service pointers. These are registry entries, not ownership.</desc>
  <defs><style>
    text { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #263443; }
    .title { font-size: 32px; font-weight: 700; }
    .section { font-size: 24px; font-weight: 700; }
    .label { font-size: 21px; font-weight: 600; }
    .body { font-size: 19px; }
    .small { font-size: 17px; fill: #596878; }
    .code { font-family: Consolas, monospace; font-size: 18px; }
    .panel { fill: #fff; stroke: #c6d1dc; stroke-width: 1.5; }
    .blue { fill: #e1eef9; stroke: #8db3d3; stroke-width: 1.5; }
    .green { fill: #e2f1e7; stroke: #91b69b; stroke-width: 1.5; }
    .orange { fill: #fbead8; stroke: #d6ac7a; stroke-width: 1.5; }
    .purple { fill: #eee6f5; stroke: #b19acb; stroke-width: 1.5; }
    .gray { fill: #edf0f4; stroke: #b1bdca; stroke-width: 1.5; }
    .arrow { fill: none; stroke: #738293; stroke-width: 2; marker-end: url(#arrow); }
    .ref { fill: none; stroke: #a07b4d; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#amber); }
    .line { fill: none; stroke: #b1bdca; stroke-width: 1.5; }
  </style>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#738293"/></marker>
  <marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#a07b4d"/></marker></defs>
  <rect width="1360" height="830" fill="#f8fafc"/>
  <rect x="40" y="34" width="6" height="64" rx="3" fill="#608db4"/>
  <text x="64" y="62" class="title" text-anchor="start">Global Lookup · A Shared Table Between Caller and Service</text>
  <text x="64" y="94" class="body" text-anchor="start">Historical design · Call sites supply names; the registry returns service pointers</text>
  <text x="40" y="153" class="small" text-anchor="start">CALL SITES</text>
  <text x="510" y="153" class="small" text-anchor="start">PROCESS-WIDE REGISTRY</text>
  <text x="1100" y="153" class="small" text-anchor="start">SERVICE OBJECTS</text>
  <rect x="40" y="174" width="390" height="414" rx="8" class="panel"/>
  <rect x="60" y="196" width="350" height="170" rx="5" class="blue"/>
  <text x="80" y="228" class="code" text-anchor="start">FileIOManager::Get()</text>
  <path d="M80 242H390" class="line"/>
  <text x="80" y="277" class="code" text-anchor="start">Texture::DecodeCPU</text>
  <text x="80" y="310" class="code" text-anchor="start">GuiManager::LoadFont</text>
  <text x="80" y="343" class="code" text-anchor="start">GBuffer / DeferredLighting</text>
  <rect x="60" y="386" width="350" height="80" rx="5" class="purple"/>
  <text x="80" y="416" class="code" text-anchor="start">JobSystem::Get()</text>
  <text x="80" y="447" class="code" text-anchor="start">ecs::World::Update</text>
  <rect x="60" y="486" width="350" height="80" rx="5" class="green"/>
  <text x="80" y="516" class="code" text-anchor="start">AssetManager::Get()</text>
  <text x="80" y="547" class="code" text-anchor="start">Editor / PbrDemo</text>
  <rect x="510" y="174" width="480" height="414" rx="8" class="panel"/>
  <text x="534" y="210" class="section" text-anchor="start">sm_AllModules</text>
  <text x="534" y="244" class="code" text-anchor="start">name</text>
  <text x="882" y="244" class="code" text-anchor="start">pointer</text>
  <rect x="534" y="266" width="340" height="58" rx="0" class="blue"/>
  <rect x="874" y="266" width="92" height="58" rx="0" class="blue"/>
  <text x="554" y="302" class="code" text-anchor="start">&quot;FileIOManager&quot;</text>
  <rect x="534" y="324" width="340" height="58" rx="0" class="purple"/>
  <rect x="874" y="324" width="92" height="58" rx="0" class="purple"/>
  <text x="554" y="360" class="code" text-anchor="start">&quot;JobSystem&quot;</text>
  <rect x="534" y="382" width="340" height="58" rx="0" class="green"/>
  <rect x="874" y="382" width="92" height="58" rx="0" class="green"/>
  <text x="554" y="418" class="code" text-anchor="start">&quot;AssetManager&quot;</text>
  <rect x="534" y="440" width="340" height="58" rx="0" class="gray"/>
  <rect x="874" y="440" width="92" height="58" rx="0" class="gray"/>
  <text x="554" y="476" class="code" text-anchor="start">&quot;Engine&quot;</text>
  <text x="534" y="543" class="small" text-anchor="start">One entry per name, shared by every caller.</text>
  <text x="534" y="568" class="small" text-anchor="start">A table entry does not express ownership.</text>
  <rect x="1100" y="266" width="220" height="58" rx="5" class="blue"/>
  <text x="1116" y="302" class="code" text-anchor="start">FileIOManager</text>
  <circle cx="918" cy="295" r="4" fill="#738293"/>
  <path d="M922 295H1096" class="arrow"/>
  <rect x="1100" y="324" width="220" height="58" rx="5" class="purple"/>
  <text x="1116" y="360" class="code" text-anchor="start">JobSystem</text>
  <circle cx="918" cy="353" r="4" fill="#738293"/>
  <path d="M922 353H1096" class="arrow"/>
  <rect x="1100" y="382" width="220" height="58" rx="5" class="green"/>
  <text x="1116" y="418" class="code" text-anchor="start">AssetManager</text>
  <circle cx="918" cy="411" r="4" fill="#738293"/>
  <path d="M922 411H1096" class="arrow"/>
  <rect x="1100" y="440" width="220" height="58" rx="5" class="gray"/>
  <text x="1116" y="476" class="code" text-anchor="start">Engine</text>
  <circle cx="918" cy="469" r="4" fill="#738293"/>
  <path d="M922 469H1096" class="arrow"/>
  <path d="M430 616H750V592" class="arrow"/>
  <text x="446" y="640" class="code" text-anchor="start">GetModule(name)</text>
  <path d="M430 588V616" class="line"/>
  <rect x="40" y="680" width="1280" height="108" rx="8" class="orange"/>
  <text x="64" y="718" class="label" text-anchor="start">The dependency is absent from the caller’s signature.</text>
  <text x="64" y="751" class="body" text-anchor="start">Every caller relies on the same table being populated; a missing name can yield a null pointer.</text>
</svg>
