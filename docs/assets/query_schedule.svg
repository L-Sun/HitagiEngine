<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img"><title>Query + 显式顺序 · 访问、时序、执行各自负责</title><defs><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#263443}.title{font-size:32px;font-weight:700}.section{font-size:24px;font-weight:700}.label{font-size:21px;font-weight:600}.body{font-size:20px}.small{font-size:18px;fill:#596878}.code{font-family:Consolas,'Microsoft YaHei',monospace;font-size:20px}.panel{fill:#fff;stroke:#c6d1dc}.blue{fill:#e1eef9;stroke:#8db3d3}.green{fill:#e2f1e7;stroke:#91b69b}.orange{fill:#fbead8;stroke:#d6ac7a}.purple{fill:#eee6f5;stroke:#b19acb}.gray{fill:#edf0f4;stroke:#b1bdca}rect{stroke-width:1.5}.arrow{fill:none;stroke:#738293;stroke-width:1.5;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#738293"/></marker></defs><rect width="1440" height="1040" fill="#f8fafc"/>
<rect x="40" y="32" width="6" height="64" rx="7" class="blue"/>
<text x="64" y="62" class="title">Query + 显式顺序 · 访问、时序、执行各自负责</text>
<text x="64" y="98" class="small">当前实现 · 实线箭头为显式依赖；组件读写仅用于检查冲突，不自动决定先后</text>
<rect x="40" y="140" width="1360" height="280" rx="7" class="panel"/>
<text x="64" y="180" class="section">1  System 声明时序：读可以位于两次写之间</text>
<rect x="64" y="215" width="400" height="112" rx="7" class="green"/>
<text x="82" y="251" class="label">A · 更新位置</text>
<text x="82" y="295" class="code">Query&lt;Position&amp;&gt;</text>
<rect x="520" y="215" width="400" height="112" rx="7" class="blue"/>
<text x="538" y="251" class="label">B · 观察中间结果</text>
<text x="538" y="295" class="code">Query&lt;const Position&amp;&gt;</text>
<rect x="976" y="215" width="400" height="112" rx="7" class="orange"/>
<text x="994" y="251" class="label">C · 再次更新位置</text>
<text x="994" y="295" class="code">Query&lt;Position&amp;&gt;</text>
<path d="M466 268 L514 268" class="arrow"/>
<path d="M922 268 L970 268" class="arrow"/>
<text x="64" y="375" class="code">SetOrder(&quot;A&quot;, &quot;B&quot;);   SetOrder(&quot;B&quot;, &quot;C&quot;);</text>
<text x="810" y="375" class="small">缺少冲突任务间的依赖路径 → 执行前报错</text>
<rect x="40" y="455" width="650" height="358" rx="7" class="panel"/>
<text x="64" y="495" class="section">2  Query 控制实体遍历</text>
<text x="64" y="536" class="code">system(query) 每次更新调用一次</text>
<text x="64" y="573" class="small">Each：串行遍历；可重复调用或做归约</text>
<text x="64" y="610" class="small">ParallelEach：分批调用同一个实体回调</text>
<rect x="64" y="638" width="184" height="66" rx="7" class="blue"/>
<text x="79" y="678" class="code">实体批次 1</text>
<rect x="268" y="638" width="184" height="66" rx="7" class="green"/>
<text x="283" y="678" class="code">实体批次 2</text>
<rect x="472" y="638" width="184" height="66" rx="7" class="purple"/>
<text x="487" y="678" class="code">实体批次 3</text>
<text x="64" y="750" class="small">所有批次完成后返回，后继任务才能开始</text>
<text x="64" y="784" class="small">回调捕获须线程安全；执行期间禁止结构修改</text>
<rect x="730" y="455" width="670" height="358" rx="7" class="panel"/>
<text x="754" y="495" class="section">3  外部 JobSystem 决定执行线程</text>
<text x="754" y="536" class="code">world.Update(jobs, dt);</text>
<rect x="754" y="570" width="622" height="78" rx="7" class="blue"/>
<text x="772" y="600" class="code">CallingThread</text>
<text x="772" y="630" class="small">Engine 帧任务：沿依赖顺序在调用线程执行</text>
<rect x="754" y="666" width="622" height="78" rx="7" class="green"/>
<text x="772" y="696" class="code">ThreadPool</text>
<text x="772" y="726" class="small">独立任务可并行；嵌套 Query 批次协作等待</text>
<text x="754" y="784" class="small">同一份 JobGraph；异常传播并等待本次执行结束</text>
<rect x="40" y="850" width="1360" height="78" rx="7" class="purple"/>
<text x="58" y="880" class="code">读 / 读：允许并行     读 / 写、写 / 写：必须有显式依赖路径</text>
<text x="58" y="910" class="small">规则跨 group 生效；group 只是宿主标签，枚举类型和值共同标识分组。</text>
<text x="40" y="982" class="small">Query 不推断捕获对象或 Entity.Get 的间接访问；消费者必须声明这些共享状态的顺序。</text>
</svg>