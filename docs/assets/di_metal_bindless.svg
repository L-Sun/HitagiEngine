<path d="M590 1395H650" class="arrow"/>
<path d="M1160 1395H1220" class="arrow"/>
<text x="80" y="1560" class="body" data-max-width="545">顶层 index 0 指向整张表，不是 texture 的表内槽位。</text>
<text x="80" y="1598" class="code" data-max-width="545">表内寻址：base + (起始槽位 + i) × 8</text>
<text x="80" y="1642" class="small" data-max-width="545">每次 Push 复制约 3.97 MiB；当前没有按帧双缓冲。</text>
<text x="650" y="1552" class="label" data-max-width="1150">BindlessMetaInfo · 24 字节（顶层 index 1）</text>
<rect x="650" y="1570" width="600" height="82" rx="0" class="purple"/>
<text x="666" y="1602" class="code" data-max-width="572">handle : BindlessHandle</text>
<text x="666" y="1632" class="small" data-max-width="572">字节 0 .. 15</text>
<rect x="1250" y="1570" width="280" height="82" rx="0" class="purple"/>
<text x="1266" y="1602" class="code" data-max-width="252">record_index : uint32</text>
<text x="1266" y="1632" class="small" data-max-width="252">字节 16 .. 19</text>
<rect x="1530" y="1570" width="310" height="82" rx="0" class="purple"/>
<text x="1546" y="1602" class="code" data-max-width="282">record_stride : uint32</text>
<text x="1546" y="1632" class="small" data-max-width="282">字节 20 .. 23</text>
<text x="650" y="1683" class="small" data-max-width="1190">load_bindless&lt;T&gt;()：从 handle 指向的 buffer，按 record_index × record_stride 读取记录。</text>
<text x="80" y="1760" class="body" data-max-width="1760">布局契约：Slang → SPIR-V → SPIRV-Cross；固定 binding 与 padding 保持六段数组偏移一致。</text>
<text x="80" y="1800" class="small" data-max-width="1760">版本只在 CPU 回收时核对；shader 没有版本表。writable 不是 GPU 地址表的访问保护位。</text>
<text x="80" y="1840" class="mini" data-max-width="1760">源码：gfx/base/bindless.cpp · metal_bindless.cpp · metal_configs.cpp · metal_command_buffer.cpp · metal_resource.cpp</text>
