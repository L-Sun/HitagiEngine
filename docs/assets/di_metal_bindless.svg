<text x="80" y="1113" class="small" data-max-width="1760">单元 i 的字节偏移 = 该数组字节偏移 + i × 8；四组 texture 数组在同一 i 处写入同一个 native view ID。</text>
<text x="80" y="1141" class="small" data-max-width="1760">类型由 shader 的静态资源类型选择；重复写入 ID 不会转换 texture 的维度或格式。</text>
<path d="M350 1160V1220" class="arrow"/>
<text x="375" y="1198" class="small" data-max-width="1000">每次 PushBindlessMetaInfo：整表复制</text>
