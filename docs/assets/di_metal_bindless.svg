<text x="80" y="78" class="title" data-max-width="1760">Metal Bindless · 句柄与数据结构</text>
<text x="80" y="113" class="small" data-max-width="1760">当前实现 · 从 CPU 索引池到 shader 资源数组；字段与容量按源码绘制，数组图形不按容量比例缩放。</text>
