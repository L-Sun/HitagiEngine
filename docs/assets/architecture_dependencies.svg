<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Architecture · Two Branches, One Foundation</title>
  <desc id="desc">Game Editor integrates the independent Editor Framework and Game branches. Both branches depend on Engine. Game Editor may also call Engine APIs directly. Colored layers show code responsibilities, not runtime object ownership.</desc>
  <defs><style>
    text { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #263443; }
    .title { font-size: 32px; font-weight: 700; }
    .section { font-size: 24px; font-weight: 700; }
    .label { font-size: 21px; font-weight: 600; }
    .body { font-size: 19px; }
    .small { font-size: 17px; fill: #596878; }
    .code { font-family: Consolas, monospace; font-size: 18px; }
    .panel { fill: #fff; stroke: #c6d1dc; stroke-width: 1.5; }
    .blue { fill: #e1eef9; stroke: #8db3d3; stroke-width: 1.5; }
    .green { fill: #e2f1e7; stroke: #91b69b; stroke-width: 1.5; }
    .orange { fill: #fbead8; stroke: #d6ac7a; stroke-width: 1.5; }
    .purple { fill: #eee6f5; stroke: #b19acb; stroke-width: 1.5; }
    .gray { fill: #edf0f4; stroke: #b1bdca; stroke-width: 1.5; }
    .arrow { fill: none; stroke: #738293; stroke-width: 2; marker-end: url(#arrow); }
    .ref { fill: none; stroke: #a07b4d; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#amber); }
    .line { fill: none; stroke: #b1bdca; stroke-width: 1.5; }
  </style>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#738293"/></marker>
  <marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#a07b4d"/></marker></defs>
  <rect width="1200" height="840" fill="#f8fafc"/>
  <rect x="40" y="34" width="6" height="64" rx="3" fill="#608db4"/>
  <text x="64" y="62" class="title" text-anchor="start">Architecture · Two Branches, One Foundation</text>
  <text x="64" y="94" class="body" text-anchor="start">Conceptual layers · Each layer uses the foundation below it</text>
  <rect x="40" y="138" width="1120" height="150" rx="8" class="purple"/>
  <text x="64" y="177" class="section" text-anchor="start">Game Editor</text>
  <text x="64" y="211" class="body" text-anchor="start">Application assembly · Depends on Editor Framework + Game</text>
  <rect x="64" y="234" width="328" height="34" rx="5" class="panel"/>
  <text x="80" y="257" class="small" text-anchor="start">Custom panels and workflows</text>
  <rect x="416" y="234" width="328" height="34" rx="5" class="panel"/>
  <text x="432" y="257" class="small" text-anchor="start">Source-to-game material adapter</text>
  <rect x="768" y="234" width="368" height="34" rx="5" class="panel"/>
  <text x="784" y="257" class="small" text-anchor="start">Game-specific asset build</text>
  <text x="40" y="325" class="small" text-anchor="start">AUTHORING TOOLS</text>
  <text x="640" y="325" class="small" text-anchor="start">GAME RUNTIME POLICY</text>
  <rect x="40" y="346" width="520" height="220" rx="8" class="orange"/>
  <text x="64" y="389" class="section" text-anchor="start">Editor Framework</text>
  <text x="64" y="426" class="body" text-anchor="start">Reusable editing capabilities</text>
  <rect x="64" y="452" width="226" height="42" rx="5" class="panel"/>
  <text x="80" y="479" class="small" text-anchor="start">Viewports / inspectors</text>
  <rect x="310" y="452" width="226" height="42" rx="5" class="panel"/>
  <text x="326" y="479" class="small" text-anchor="start">Commands / validation</text>
  <rect x="64" y="504" width="226" height="42" rx="5" class="panel"/>
  <text x="80" y="531" class="small" text-anchor="start">Source import</text>
  <rect x="310" y="504" width="226" height="42" rx="5" class="panel"/>
  <text x="326" y="531" class="small" text-anchor="start">Cook APIs</text>
  <rect x="640" y="346" width="520" height="220" rx="8" class="green"/>
  <text x="664" y="389" class="section" text-anchor="start">Game</text>
  <text x="664" y="426" class="body" text-anchor="start">Rules chosen by the game</text>
  <rect x="664" y="452" width="226" height="42" rx="5" class="panel"/>
  <text x="680" y="479" class="small" text-anchor="start">Gameplay / systems</text>
  <rect x="910" y="452" width="226" height="42" rx="5" class="panel"/>
  <text x="926" y="479" class="small" text-anchor="start">Render composition</text>
  <rect x="664" y="504" width="226" height="42" rx="5" class="panel"/>
  <text x="680" y="531" class="small" text-anchor="start">Material contracts</text>
  <rect x="910" y="504" width="226" height="42" rx="5" class="panel"/>
  <text x="926" y="531" class="small" text-anchor="start">Resource semantics</text>
  <path d="M600 350V564" class="line"/>
  <text x="600" y="600" class="small" text-anchor="middle">Independent branches · Neither imports the other</text>
  <rect x="40" y="624" width="1120" height="142" rx="8" class="blue"/>
  <text x="64" y="664" class="section" text-anchor="start">Engine</text>
  <text x="64" y="696" class="body" text-anchor="start">Shared runtime abstractions used by both branches</text>
  <rect x="64" y="718" width="170" height="30" rx="5" class="panel"/>
  <text x="78" y="739" class="small" text-anchor="start">Services</text>
  <rect x="254" y="718" width="210" height="30" rx="5" class="panel"/>
  <text x="268" y="739" class="small" text-anchor="start">ECS / physics</text>
  <rect x="484" y="718" width="250" height="30" rx="5" class="panel"/>
  <text x="498" y="739" class="small" text-anchor="start">Graphics / render</text>
  <rect x="754" y="718" width="140" height="30" rx="5" class="panel"/>
  <text x="768" y="739" class="small" text-anchor="start">GUI</text>
  <rect x="914" y="718" width="222" height="30" rx="5" class="panel"/>
  <text x="928" y="739" class="small" text-anchor="start">Runtime assets</text>
  <text x="40" y="808" class="small" text-anchor="start">Game Editor can also call Engine APIs directly. Boxes describe code boundaries, not object containment.</text>
</svg>
