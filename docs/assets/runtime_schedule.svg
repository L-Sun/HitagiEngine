<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img"><title>Schedule · 同一张依赖图，两种执行方式</title><defs><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#263443}.title{font-size:32px;font-weight:700}.section{font-size:24px;font-weight:700}.label{font-size:21px;font-weight:600}.body{font-size:20px}.small{font-size:18px;fill:#596878}.code{font-family:Consolas,'Microsoft YaHei',monospace;font-size:20px}.panel{fill:#fff;stroke:#c6d1dc}.blue{fill:#e1eef9;stroke:#8db3d3}.green{fill:#e2f1e7;stroke:#91b69b}.orange{fill:#fbead8;stroke:#d6ac7a}.purple{fill:#eee6f5;stroke:#b19acb}.gray{fill:#edf0f4;stroke:#b1bdca}rect{stroke-width:1.5}.arrow{fill:none;stroke:#738293;stroke-width:1.5;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#738293"/></marker></defs><rect width="1440" height="1100" fill="#f8fafc"/>
<rect x="40" y="32" width="6" height="64" rx="7" class="blue"/>
<text x="64" y="62" class="title">Schedule · 同一张依赖图，两种执行方式</text>
<text x="64" y="98" class="small">当前实现 · 左侧为engine 定义的 FrameStage 顺序；右侧表示执行线程；这里没有 Module Tick 遍历</text>
<rect x="40" y="140" width="690" height="880" rx="7" class="panel"/>
<text x="64" y="180" class="section">运行时帧 · 外部传入 frameJobs</text>
<text x="64" y="213" class="small">事件泵之外执行；窗口模态回调复用同一个入口</text>
<rect x="64" y="242" width="642" height="96" rx="7" class="purple"/>
<text x="82" y="271" class="label">First</text>
<text x="252" y="271" class="code">Graphics.Device → Graphics.Queues</text>
<text x="252" y="308" class="small">Debug.Clear 同属 First；不需要实体</text>
<path d="M180 340 L180 358" class="arrow"/>
<rect x="64" y="361" width="642" height="96" rx="7" class="green"/>
<text x="82" y="390" class="label">PreUpdate</text>
<text x="252" y="390" class="code">Viewer.Input</text>
<text x="252" y="427" class="small">GUI 布局、输入与 UI 命令</text>
<path d="M180 459 L180 477" class="arrow"/>
<rect x="64" y="480" width="642" height="96" rx="7" class="green"/>
<text x="82" y="509" class="label">Update</text>
<text x="252" y="509" class="code">Viewer.Scene</text>
<text x="252" y="546" class="small">场景动画、相机和状态更新</text>
<path d="M180 578 L180 596" class="arrow"/>
<rect x="64" y="599" width="642" height="96" rx="7" class="gray"/>
<text x="82" y="628" class="label">PostUpdate</text>
<text x="252" y="628" class="code">宿主可声明后处理系统</text>
<text x="252" y="665" class="small">空组仍保留传递依赖约束</text>
<path d="M180 697 L180 715" class="arrow"/>
<rect x="64" y="718" width="642" height="96" rx="7" class="purple"/>
<text x="82" y="747" class="label">Render</text>
<text x="252" y="747" class="code">Viewer.Render / 选定的渲染系统</text>
<text x="252" y="784" class="small">构图、GUI 合成、提交与呈现</text>
<path d="M180 816 L180 834" class="arrow"/>
<rect x="64" y="837" width="642" height="96" rx="7" class="blue"/>
<text x="82" y="866" class="label">Last</text>
<text x="252" y="866" class="code">Viewer.Publish</text>
<text x="252" y="903" class="small">发布 UI 状态；随后 Engine 推进 Clock</text>
<rect x="764" y="140" width="636" height="282" rx="7" class="panel"/>
<text x="788" y="180" class="section">一次构图 · 先验证再执行</text>
<rect x="788" y="209" width="588" height="78" rx="7" class="orange"/>
<text x="806" y="239" class="code">Query 访问 + 显式 SetOrder</text>
<text x="806" y="269" class="small">检测环与未排序的读写冲突；执行前报错</text>
<rect x="788" y="306" width="588" height="78" rx="7" class="purple"/>
<text x="806" y="336" class="code">同一份有向无环图</text>
<text x="806" y="366" class="small">JobGraph 交给外部 JobSystem，等待执行完成</text>
<rect x="764" y="454" width="636" height="224" rx="7" class="blue"/>
<text x="788" y="494" class="section">调用线程执行</text>
<text x="788" y="535" class="code">JobSystem(CallingThread)</text>
<text x="788" y="574" class="small">按拓扑顺序在调用线程执行所有任务</text>
<text x="788" y="612" class="small">Engine 使用此路径；窗口 / GUI 保持线程归属</text>
<text x="788" y="650" class="small">重入被拒绝；异常恢复更新守卫</text>
<rect x="764" y="710" width="636" height="310" rx="7" class="green"/>
<text x="788" y="750" class="section">工作线程执行</text>
<text x="788" y="791" class="code">World.Update(poolJobs, dt)</text>
<text x="788" y="830" class="small">Taskflow 按同一依赖图调度，等待全部完成</text>
<rect x="788" y="856" width="172" height="63" rx="7" class="panel"/>
<text x="803" y="895" class="code">Worker</text>
<rect x="984" y="856" width="172" height="63" rx="7" class="panel"/>
<text x="999" y="895" class="code">Worker</text>
<rect x="1180" y="856" width="172" height="63" rx="7" class="panel"/>
<text x="1195" y="895" class="code">Worker</text>
<text x="788" y="957" class="small">场景动画沿用此路径；可由 Viewer.Scene 调用</text>
<text x="788" y="989" class="small">调用者明确选择执行方式，不隐式迁移 UI 工作</text>
<text x="40" y="1060" class="small">跨组也只按显式依赖排序；Query 仅声明读写，未排序的写冲突会在执行前报错。</text>
</svg>