<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img"><title>Engine · 所有权归成员，运行工作归 ECS</title><defs><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#263443}.title{font-size:32px;font-weight:700}.section{font-size:24px;font-weight:700}.label{font-size:21px;font-weight:600}.body{font-size:20px}.small{font-size:18px;fill:#596878}.code{font-family:Consolas,'Microsoft YaHei',monospace;font-size:20px}.panel{fill:#fff;stroke:#c6d1dc}.blue{fill:#e1eef9;stroke:#8db3d3}.green{fill:#e2f1e7;stroke:#91b69b}.orange{fill:#fbead8;stroke:#d6ac7a}.purple{fill:#eee6f5;stroke:#b19acb}.gray{fill:#edf0f4;stroke:#b1bdca}rect{stroke-width:1.5}.arrow{fill:none;stroke:#738293;stroke-width:1.5;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#738293"/></marker></defs><rect width="1440" height="1050" fill="#f8fafc"/>
<rect x="40" y="32" width="6" height="64" rx="7" class="blue"/>
<text x="64" y="62" class="title">Engine · 所有权归成员，运行工作归 ECS</text>
<text x="64" y="98" class="small">当前实现 · 嵌套容器表示拥有；橙色表示借用；成员顺序与任务执行顺序分别定义</text>
<rect x="40" y="140" width="1360" height="735" rx="7" class="panel"/>
<text x="64" y="180" class="section">Engine · 组合根</text>
<rect x="64" y="210" width="598" height="610" rx="7" class="blue"/>
<text x="86" y="248" class="section">直接持有的基础设施</text>
<text x="86" y="279" class="small">按依赖顺序构造，逆序释放</text>
<rect x="86" y="308" width="554" height="78" rx="7" class="panel"/>
<text x="104" y="338" class="code">MemoryManager / FileIO / JobSystem</text>
<text x="104" y="368" class="small">普通服务，不声明空的逐帧任务</text>
<rect x="86" y="405" width="554" height="78" rx="7" class="purple"/>
<text x="104" y="435" class="code">Application / Device</text>
<text x="104" y="465" class="small">窗口由 Application 持有；设备管理底层状态</text>
<rect x="86" y="502" width="554" height="78" rx="7" class="purple"/>
<text x="104" y="532" class="code">Queues / Bindings / ShaderCompiler</text>
<text x="104" y="562" class="small">三个独立成员；没有 GraphicsServices 包装</text>
<rect x="86" y="599" width="554" height="78" rx="7" class="green"/>
<text x="104" y="629" class="code">AssetManager / PhysicsWorld</text>
<text x="104" y="659" class="small">资源加载与物理 Step 由消费者按需调用</text>
<text x="86" y="752" class="small">Engine.Clock 在帧末推进，保持原有时间语义</text>
<rect x="696" y="210" width="680" height="610" rx="7" class="gray"/>
<text x="718" y="248" class="section">ecs::World · 运行时状态与调度</text>
<rect x="718" y="280" width="636" height="78" rx="7" class="green"/>
<text x="736" y="310" class="code">SystemManager · 绑定的系统实例</text>
<text x="736" y="340" class="small">gfx::GraphicsFrameSystem / DebugManager / 宿主系统</text>
<rect x="718" y="378" width="636" height="78" rx="7" class="orange"/>
<text x="736" y="408" class="code">构造函数注入 Device&amp; / Queues&amp; …</text>
<text x="736" y="438" class="small">注入通用 Group；系统不依赖 engine 阶段枚举</text>
<rect x="718" y="476" width="636" height="204" rx="7" class="purple"/>
<text x="738" y="512" class="section">Schedule · 缓存的执行快照</text>
<text x="738" y="552" class="small">先应用 engine 阶段配置，再由系统声明任务</text>
<text x="738" y="590" class="small">FrameStage / ConfigureFrameStages 由 engine 提供</text>
<text x="738" y="628" class="small">快照保留系统实例，执行中取消注册不会悬空</text>
<text x="738" y="660" class="small">执行顺序由依赖图决定，不取决于成员排列</text>
<rect x="718" y="704" width="636" height="78" rx="7" class="panel"/>
<text x="736" y="734" class="code">EntityManager · 可有实体，也可以为空</text>
<text x="736" y="764" class="small">无参数任务每帧运行一次，不需要伪实体</text>
<text x="64" y="852" class="small">World 先于所有借用的服务销毁；系统以注册逆序结束生命周期。外部资源仍由其拥有者负责。</text>
<rect x="40" y="920" width="405" height="78" rx="7" class="blue"/>
<text x="58" y="950" class="code">1  停止帧入口 / CPU 工作收尾</text>
<text x="58" y="980" class="small">清除窗口模态回调，等待已提交任务</text>
<rect x="480" y="920" width="425" height="78" rx="7" class="purple"/>
<text x="498" y="950" class="code">2  GPU 完成 / 释放 World</text>
<text x="498" y="980" class="small">队列屏障后释放快照与系统状态</text>
<rect x="940" y="920" width="460" height="78" rx="7" class="green"/>
<text x="958" y="950" class="code">3  设施逆序释放</text>
<text x="958" y="980" class="small">Assets → … → Device → … → Memory</text>
<path d="M450 959 L474 959" class="arrow"/>
<path d="M910 959 L934 959" class="arrow"/>
</svg>