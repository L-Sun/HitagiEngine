<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img"><title>Runtime / App / Plugin · 当前所有权</title><defs><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#263443}.title{font-size:32px;font-weight:700}.section{font-size:24px;font-weight:700}.label{font-size:21px;font-weight:600}.body{font-size:20px}.small{font-size:18px;fill:#596878}.code{font-family:Consolas,'Microsoft YaHei',monospace;font-size:20px}.panel{fill:#fff;stroke:#c6d1dc}.blue{fill:#e1eef9;stroke:#8db3d3}.green{fill:#e2f1e7;stroke:#91b69b}.orange{fill:#fbead8;stroke:#d6ac7a}.purple{fill:#eee6f5;stroke:#b19acb}.gray{fill:#edf0f4;stroke:#b1bdca}rect{stroke-width:1.5}.arrow{fill:none;stroke:#738293;stroke-width:1.5;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#738293"/></marker></defs>
<rect width="1440" height="1050" fill="#f8fafc"/>
<text x="48" y="62" class="title">Runtime / App / Plugin · 当前实现</text>
<text x="48" y="100" class="small">嵌套区域表示拥有；橙色表示借用；箭头表示安装动作，不表示逐帧调用</text>
<rect x="40" y="135" width="1360" height="165" rx="7" class="blue"/>
<text x="64" y="173" class="section">core::Runtime · 先构造，最后销毁</text>
<text x="64" y="217" class="code">Logging → MemoryManager → IOService → JobSystem</text>
<text x="64" y="260" class="small">进程基础设施：App、PluginSet 与 World 的 PMR 存储位于内存池作用域内</text>
<rect x="40" y="325" width="910" height="565" rx="7" class="panel"/>
<text x="64" y="367" class="section">App · 组装入口与主线程帧循环</text>
<rect x="64" y="389" width="220" height="62" rx="7" class="orange"/>
<rect x="300" y="389" width="626" height="62" rx="7" class="blue"/>
<text x="85" y="428" class="code">Runtime&amp;</text>
<text x="322" y="428" class="code">CallingThread JobSystem / Clock</text>
<rect x="64" y="470" width="280" height="98" rx="7" class="purple"/>
<text x="84" y="505" class="code">core::PluginSet&lt;App&gt;</text>
<text x="84" y="539" class="small">记录类型 / 安装状态</text>
<rect x="383" y="470" width="543" height="98" rx="7" class="green"/>
<text x="405" y="505" class="code">Build(App&amp;) const · 一次性安装</text>
<text x="405" y="539" class="small">依赖显式注入；插件对象可为临时值</text>
<path d="M344 519 L382 519" class="arrow"/>
<rect x="64" y="590" width="862" height="270" rx="7" class="green"/>
<text x="85" y="626" class="section">ecs::World · 独立资源与调度</text>
<rect x="85" y="649" width="820" height="74" rx="7" class="panel"/>
<text x="104" y="680" class="code">Resources: PlatformContext / GraphicsContext / AssetService</text>
<text x="104" y="707" class="small">InputState（借用） · Time · DebugDraw · 可选 GuiContext / PhysicsWorld</text>
<rect x="85" y="738" width="820" height="94" rx="7" class="panel"/>
<text x="104" y="770" class="code">Entities + Systems + cached Schedule</text>
<text x="104" y="804" class="small">Query + Res&lt;T&gt; / ResMut&lt;T&gt; 声明访问；SetOrder 声明执行顺序</text>
<path d="M650 568 L650 589" class="arrow"/>
<rect x="978" y="325" width="422" height="565" rx="7" class="panel"/>
<text x="1002" y="367" class="section">同一 Runtime 下的其他 World</text>
<rect x="1002" y="402" width="374" height="160" rx="7" class="purple"/>
<text x="1022" y="439" class="code">RenderApp（SubApp）</text>
<text x="1022" y="477" class="body">RenderContext / Renderer</text>
<text x="1022" y="516" class="small">独立 World；主 App 完成后更新</text>
<rect x="1002" y="590" width="374" height="210" rx="7" class="blue"/>
<text x="1022" y="630" class="label">另一个 App / 独立 Scene</text>
<text x="1022" y="675" class="body">资源按 World 隔离</text>
<text x="1022" y="718" class="body">共享依赖须显式借用</text>
<text x="1022" y="761" class="small">跨 World 冲突由宿主同步</text>
<rect x="40" y="915" width="1360" height="99" rx="7" class="orange"/>
<text x="64" y="953" class="label">退出：等待 CPU / GPU → 清理回调 → Schedule / Systems → Resources（逆安装序）</text>
<text x="64" y="987" class="small">所有 App 和外部资源释放后再退出 Runtime；PluginSet 不负责逐帧执行，也不拥有业务服务</text>
</svg>