<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1090" viewBox="0 0 1440 1090" role="img" aria-labelledby="title desc">
  <title id="title">Engine · Ownership Is a Container, References Are Fields</title>
  <desc id="desc">Engine owns the infrastructure members and RuntimeModule subtree. Infrastructure members are MemoryManager, FileIOManager and JobSystem. The subtree lists modules in relative tick order, with Debug omitted. GraphicsServices owns queues, bindings and compiler. AssetManager borrows FileIOManager and JobSystem; PhysicsWorld borrows JobSystem; IRenderer uses Application and graphics services; GuiManager uses Application and FileIOManager; RenderRuntime uses Device and graphics services. Device is used to create GraphicsServices. Subtree teardown precedes reverse member destruction.</desc>
  <defs><style>
    text { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #263443; }
    .title { font-size: 32px; font-weight: 700; }
    .section { font-size: 24px; font-weight: 700; }
    .label { font-size: 21px; font-weight: 600; }
    .body { font-size: 19px; }
    .small { font-size: 17px; fill: #596878; }
    .code { font-family: Consolas, monospace; font-size: 18px; }
    .panel { fill: #fff; stroke: #c6d1dc; stroke-width: 1.5; }
    .blue { fill: #e1eef9; stroke: #8db3d3; stroke-width: 1.5; }
    .green { fill: #e2f1e7; stroke: #91b69b; stroke-width: 1.5; }
    .orange { fill: #fbead8; stroke: #d6ac7a; stroke-width: 1.5; }
    .purple { fill: #eee6f5; stroke: #b19acb; stroke-width: 1.5; }
    .gray { fill: #edf0f4; stroke: #b1bdca; stroke-width: 1.5; }
    .arrow { fill: none; stroke: #738293; stroke-width: 2; marker-end: url(#arrow); }
    .ref { fill: none; stroke: #a07b4d; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#amber); }
    .line { fill: none; stroke: #b1bdca; stroke-width: 1.5; }
  </style>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#738293"/></marker>
  <marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#a07b4d"/></marker></defs>
  <rect width="1440" height="1090" fill="#f8fafc"/>
  <rect x="40" y="34" width="6" height="64" rx="3" fill="#608db4"/>
  <text x="64" y="62" class="title" text-anchor="start">Engine · Ownership Is a Container, References Are Fields</text>
  <text x="64" y="94" class="body" text-anchor="start">Nested boundaries show owned objects · Amber labels identify borrowed dependencies</text>
  <rect x="40" y="134" width="1360" height="718" rx="10" class="panel"/>
  <text x="64" y="175" class="section" text-anchor="start">Engine</text>
  <text x="1376" y="175" class="small" text-anchor="end">Owns both regions below</text>
  <rect x="64" y="202" width="350" height="588" rx="8" class="blue"/>
  <text x="88" y="241" class="label" text-anchor="start">Infrastructure Members</text>
  <text x="88" y="273" class="small" text-anchor="start">Declaration order · Never tick</text>
  <rect x="88" y="302" width="302" height="98" rx="5" class="panel"/>
  <text x="108" y="337" class="code" text-anchor="start">1   MemoryManager</text>
  <text x="108" y="374" class="small" text-anchor="start">Default memory resource</text>
  <rect x="88" y="422" width="302" height="98" rx="5" class="panel"/>
  <text x="108" y="457" class="code" text-anchor="start">2   FileIOManager</text>
  <text x="108" y="494" class="small" text-anchor="start">File access service</text>
  <rect x="88" y="542" width="302" height="98" rx="5" class="panel"/>
  <text x="108" y="577" class="code" text-anchor="start">3   JobSystem</text>
  <text x="108" y="614" class="small" text-anchor="start">Worker pool / task execution</text>
  <text x="88" y="691" class="small" text-anchor="start">These outlive the module subtree.</text>
  <text x="88" y="724" class="small" text-anchor="start">References into these objects</text>
  <text x="88" y="751" class="small" text-anchor="start">do not transfer ownership.</text>
  <rect x="450" y="202" width="926" height="588" rx="8" class="gray"/>
  <text x="474" y="241" class="label" text-anchor="start">RuntimeModule Subtree</text>
  <text x="474" y="269" class="small" text-anchor="start">Relative Tick order ↓</text>
  <text x="902" y="269" class="small" text-anchor="start">Borrowed references / creation inputs</text>
  <rect x="474" y="288" width="878" height="42" rx="5" class="panel"/>
  <text x="490" y="316" class="code" text-anchor="start">Application</text>
  <rect x="474" y="336" width="878" height="42" rx="5" class="purple"/>
  <text x="490" y="364" class="code" text-anchor="start">gfx::Device</text>
  <rect x="474" y="384" width="878" height="88" rx="5" class="purple"/>
  <text x="490" y="412" class="code" text-anchor="start">GraphicsServices</text>
  <rect x="884" y="390" width="452" height="30" rx="3" class="orange"/>
  <text x="900" y="411" class="small" text-anchor="start">Created using Device</text>
  <rect x="490" y="430" width="240" height="28" rx="2" class="panel"/>
  <text x="502" y="450" class="small" text-anchor="start">Queues</text>
  <rect x="746" y="430" width="264" height="28" rx="2" class="panel"/>
  <text x="758" y="450" class="small" text-anchor="start">Bindings</text>
  <rect x="1026" y="430" width="310" height="28" rx="2" class="panel"/>
  <text x="1038" y="450" class="small" text-anchor="start">ShaderCompiler</text>
  <rect x="474" y="480" width="878" height="42" rx="5" class="green"/>
  <text x="490" y="508" class="code" text-anchor="start">AssetManager</text>
  <rect x="884" y="485" width="452" height="32" rx="3" class="orange"/>
  <text x="900" y="507" class="small" text-anchor="start">FileIOManager&amp; · JobSystem&amp;</text>
  <rect x="474" y="528" width="878" height="42" rx="5" class="green"/>
  <text x="490" y="556" class="code" text-anchor="start">PhysicsWorld</text>
  <rect x="884" y="533" width="452" height="32" rx="3" class="orange"/>
  <text x="900" y="555" class="small" text-anchor="start">JobSystem&amp;</text>
  <rect x="474" y="576" width="878" height="42" rx="5" class="panel"/>
  <text x="490" y="604" class="code" text-anchor="start">OutLogicArea</text>
  <text x="900" y="603" class="small" text-anchor="start">Game / editor modules mount here</text>
  <rect x="474" y="624" width="878" height="42" rx="5" class="purple"/>
  <text x="490" y="652" class="code" text-anchor="start">IRenderer</text>
  <rect x="884" y="629" width="452" height="32" rx="3" class="orange"/>
  <text x="900" y="651" class="small" text-anchor="start">Application&amp; · individual graphics services</text>
  <rect x="474" y="672" width="878" height="42" rx="5" class="panel"/>
  <text x="490" y="700" class="code" text-anchor="start">GuiManager</text>
  <rect x="884" y="677" width="452" height="32" rx="3" class="orange"/>
  <text x="900" y="699" class="small" text-anchor="start">Application&amp; · FileIOManager&amp;</text>
  <rect x="474" y="720" width="878" height="42" rx="5" class="purple"/>
  <text x="490" y="748" class="code" text-anchor="start">RenderRuntime</text>
  <rect x="884" y="725" width="452" height="32" rx="3" class="orange"/>
  <text x="900" y="747" class="small" text-anchor="start">Device&amp; · individual graphics services</text>
  <text x="64" y="824" class="small" text-anchor="start">IRenderer starts as ClearRenderer; the host may install a preset. Debug is omitted from this relative-order view.</text>
  <text x="40" y="898" class="section" text-anchor="start">DESTRUCTION ORDER</text>
  <text x="1400" y="898" class="small" text-anchor="end">Consumers are destroyed before their dependencies</text>
  <rect x="40" y="924" width="444" height="98" rx="5" class="gray"/>
  <text x="64" y="960" class="code" text-anchor="start">1   UnloadAllSubModules()</text>
  <text x="64" y="994" class="small" text-anchor="start">RenderRuntime … Application, in reverse</text>
  <path d="M488 973H530" class="arrow"/>
  <rect x="534" y="924" width="266" height="98" rx="5" class="blue"/>
  <text x="558" y="960" class="code" text-anchor="start">2   JobSystem</text>
  <text x="558" y="994" class="small" text-anchor="start">Wait for pending tasks</text>
  <path d="M804 973H846" class="arrow"/>
  <rect x="850" y="924" width="266" height="98" rx="5" class="blue"/>
  <text x="874" y="960" class="code" text-anchor="start">3   FileIOManager</text>
  <text x="874" y="994" class="small" text-anchor="start">Release file service</text>
  <path d="M1120 973H1162" class="arrow"/>
  <rect x="1166" y="924" width="234" height="98" rx="5" class="blue"/>
  <text x="1182" y="960" class="code" text-anchor="start">4   MemoryManager</text>
  <text x="1182" y="994" class="small" text-anchor="start">Release memory service</text>
  <text x="40" y="1060" class="small" text-anchor="start">Containment means ownership. Amber labels identify borrowed dependencies or explicitly marked creation inputs.</text>
</svg>
