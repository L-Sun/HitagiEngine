<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1890" viewBox="0 0 1920 1890" role="img" aria-labelledby="title desc">
  <title id="title">Hitagi Asset Module — Editor, Cook and Runtime</title>
  <desc id="desc">Current resource architecture: editor import and cooking, shared asset objects, weak-reference registries, renderer contracts, service injection, and GPU residency.</desc>
  <metadata>Source: hitagi/editor/{editor.cppm,usd.cppm,cook.cppm,material_compiler.cppm}; hitagi/engine/asset/{asset_service.cpp,asset_service.cppm,resource.cpp,scene.cpp,mesh.cpp,material.cpp,texture.cpp,pipeline.cpp,shader.cpp,cooked_binary.cpp,cooked_format.cpp}; hitagi/engine/plugins.cpp; hitagi/engine/core/runtime.cpp; hitagi/engine/app/host.cpp; hitagi/engine/render/deferred/renderer.cpp. Current implementation, not a proposed API. Visual language follows the companion cooked_asset_layout.svg.</metadata>
  <defs>
    <style>
      text { font-family: 'Segoe UI', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #263443; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #637181; }
      .section { font-size: 24px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 650; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #596878; }
      .code { font-family: Consolas, 'Microsoft YaHei', monospace; font-size: 18px; }
      .mini { font-family: Consolas, 'Microsoft YaHei', monospace; font-size: 16px; fill: #596878; }
      .panel { fill: #fff; stroke: #c6d1dc; stroke-width: 1.5; }
      .blue { fill: #e1eef9; stroke: #8db3d3; stroke-width: 1.5; }
      .green { fill: #e2f1e7; stroke: #91b69b; stroke-width: 1.5; }
      .orange { fill: #fbead8; stroke: #d6ac7a; stroke-width: 1.5; }
      .purple { fill: #eee6f5; stroke: #b19acb; stroke-width: 1.5; }
      .gray { fill: #edf0f4; stroke: #b1bdca; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #738293; stroke-width: 2; marker-end: url(#arrow); }
      .inject { fill: none; stroke: #a07b4d; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#amber); }
      .own { fill: none; stroke: #659276; stroke-width: 2; marker-end: url(#greenArrow); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#738293"/></marker>
    <marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#a07b4d"/></marker>
    <marker id="greenArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#659276"/></marker>
  </defs>
  <rect width="1920" height="1890" fill="#f8fafc"/>
  <rect x="56" y="47" width="6" height="70" rx="3" fill="#608db4"/>
  <text x="80" y="78" class="title">Asset Module · Editor to Runtime</text>
  <text x="80" y="112" class="subtitle">Shared objects for editing and rendering. Editor handles source data; asset manages identity and residency.</text>
  <rect x="1580" y="53" width="284" height="43" rx="21" fill="#e8edf3"/>
  <text x="1722" y="81" class="code" text-anchor="middle">Hitagi / Current Design</text>

  <!-- Editor: conversion, editing and cooking share the runtime data model. -->
  <rect x="56" y="153" width="1808" height="440" rx="10" class="panel"/>
  <text x="80" y="191" class="section">01   editor / Import, Compile and Cook</text>
  <text x="1840" y="191" class="small" text-anchor="end">Editor accesses asset through engine; resource types belong to asset.</text>
  <rect x="80" y="218" width="340" height="130" rx="5" class="gray"/>
  <text x="100" y="250" class="label">Source Assets / Authoring</text>
  <text x="100" y="282" class="code">USD / USDA / USDC / USDZ</text>
  <text x="100" y="316" class="body">Scene, geometry, materials, texture refs</text>
  <path d="M424 283H468" class="arrow"/>

  <rect x="472" y="218" width="360" height="130" rx="5" class="orange"/>
  <text x="492" y="250" class="label">UsdSceneImporter</text>
  <text x="492" y="282" class="body">Topology, entities, material conversion</text>
  <text x="492" y="316" class="small">ImportEditorScene routes source vs. cooked</text>
  <path d="M836 283H882" class="arrow"/>

  <rect x="886" y="218" width="440" height="130" rx="5" class="green"/>
  <text x="906" y="250" class="label">Asset Objects in the Editor</text>
  <text x="906" y="282" class="code">Scene / Mesh / Material / Texture</text>
  <text x="906" y="316" class="small">Direct preview; AssetService loads cooked objects</text>
  <path d="M1330 283H1382" class="arrow"/>

  <rect x="1386" y="218" width="454" height="350" rx="5" class="blue"/>
  <text x="1408" y="250" class="label">Cook API / Build Runtime Data</text>
  <text x="1408" y="288" class="code">CookEditorScene(Scene&amp;)</text>
  <text x="1408" y="320" class="code">CookEditorMaterial(EditorMaterial)</text>
  <path d="M1408 343H1818" stroke="#b5c9dc"/>
  <text x="1408" y="378" class="body">Collect meshes, materials, instances, transforms</text>
  <text x="1408" y="410" class="body">Serialize parameters, passes and shader descs</text>
  <text x="1408" y="442" class="body">Write vertices, indices and instance bindings</text>
  <text x="1408" y="480" class="code">→ core::Buffer (HTGC bytes)</text>
  <text x="1408" y="517" class="small">asset:cooked_format defines the shared binary contract</text>
  <text x="1408" y="546" class="small">Source metadata and graphs stay outside cooked data</text>

  <path d="M250 398V352" class="arrow"/>
  <text x="274" y="381" class="small">Select / Import</text>
  <rect x="80" y="400" width="340" height="168" rx="5" class="gray"/>
  <text x="100" y="432" class="label">Host / Tool Composition</text>
  <text x="100" y="466" class="body">Host selects source files and options</text>
  <text x="100" y="496" class="body">Tools call import and cook APIs</text>
  <text x="100" y="526" class="body">USD Viewer previews shared assets</text>
  <text x="100" y="552" class="small">App plugins assemble runtime services</text>

  <path d="M652 398V352" class="inject"/>
  <text x="676" y="381" class="small">Inject MaterialProcessor</text>
  <rect x="472" y="400" width="360" height="168" rx="5" class="orange"/>
  <text x="492" y="432" class="label">Material Compilation</text>
  <text x="492" y="466" class="body">Game / preset: semantics and contracts</text>
  <text x="492" y="496" class="mini">MaterialGraph → MaterialGraphCompiler</text>
  <text x="492" y="526" class="small">Output: Slang, bindings, pass / pipeline descs</text>
  <text x="492" y="552" class="small">CompilePipelineLayout: CPU reflection</text>

  <path d="M1106 352V396" class="arrow"/>
  <text x="1128" y="381" class="small">Editor-only state</text>
  <rect x="886" y="400" width="440" height="168" rx="5" class="orange"/>
  <text x="906" y="432" class="label">Source Metadata and Cook State</text>
  <text x="906" y="466" class="code">EditorMaterial = Material + SourceInfo</text>
  <text x="906" y="496" class="small">EditorCookContext tracks source info per Material</text>
  <text x="906" y="526" class="body">Current cook captures explicit preview state</text>
  <text x="906" y="552" class="small">Mesh shared; camera / light are component state</text>

  <!-- Serialized delivery boundary. Cook returns bytes; persistence is caller-owned. -->
  <path d="M1613 572V615H530V646" class="arrow"/>
  <text x="820" y="639" class="small">Caller saves the bytes or passes them directly to LoadCooked*</text>
  <rect x="80" y="650" width="900" height="106" rx="5" class="blue"/>
  <text x="102" y="685" class="label">HTGC / Cooked Scene and Material</text>
  <text x="102" y="719" class="code">Header → meta → strings → blob</text>
  <text x="528" y="719" class="small">Fixed records + offsets; re-cook on version mismatch</text>
  <rect x="1110" y="650" width="730" height="106" rx="5" class="gray"/>
  <text x="1132" y="685" class="label">External Files / Resolve by Reference</text>
  <text x="1132" y="719" class="body">Pixels remain in image files; shader descriptors carry paths or source.</text>
  <path d="M984 704H1106" class="arrow"/>
  <text x="1045" y="692" class="small" text-anchor="middle">Path refs</text>
  <text x="504" y="792" class="small">ImportScene / ImportMaterial read files; LoadCooked* accepts bytes</text>

  <!-- Asset runtime boundary. -->
  <rect x="56" y="807" width="1268" height="618" rx="10" class="panel"/>
  <text x="80" y="843" class="section">02   asset / Runtime Resources</text>
  <text x="1298" y="843" class="small" text-anchor="end">Shared by editor and game</text>
  <path d="M478 760V857" class="arrow"/>

  <rect x="80" y="861" width="416" height="220" rx="5" class="blue"/>
  <text x="100" y="895" class="label">AssetService</text>
  <text x="100" y="928" class="body">Loading, lookup, deduplication, unload policy</text>
  <path d="M100 949H476" stroke="#b5c9dc"/>
  <text x="100" y="979" class="code">path → weak_ptr&lt;Texture&gt;</text>
  <text x="100" y="1008" class="code">name → weak_ptr&lt;Material&gt;</text>
  <text x="100" y="1037" class="code">UUID → weak_ptr&lt;Resource&gt;</text>
  <text x="100" y="1065" class="small">Registry indexes resources; owners control lifetime</text>
  <path d="M288 1085V1122" class="arrow"/>

  <rect x="80" y="1126" width="416" height="121" rx="5" class="blue"/>
  <text x="100" y="1158" class="label">:cooked_binary / Internal Reader</text>
  <text x="100" y="1190" class="body">Validate HTGC, build objects, copy geometry</text>
  <text x="100" y="1221" class="small">AssetService injects the CookedTextureResolver</text>
  <text x="538" y="1110" class="small" transform="rotate(-90 538 1110)">Build objects</text>
  <path d="M288 1251V1282" class="arrow"/>

  <rect x="80" y="1286" width="416" height="113" rx="5" class="orange"/>
  <text x="100" y="1318" class="label">AcquireTexture / Shared Lazy Textures</text>
  <text x="100" y="1344" class="small">Injected ImageLoader + JobSubmitter</text>
  <text x="100" y="1368" class="small">Also: ImportTexture / ImportTextureAsync</text>
  <text x="100" y="1392" class="small">ImageCodec: BMP / JPEG / PNG / TGA</text>

  <!-- Shared ownership graph; green arrows are ownership, not module imports. -->
  <rect x="550" y="861" width="750" height="538" rx="5" fill="#fbfdfb" stroke="#c1d4c7"/>
  <rect x="570" y="878" width="710" height="66" rx="4" class="green"/>
  <text x="588" y="906" class="label">Resource / Common Base Class</text>
  <text x="588" y="932" class="small">Name + UUID + Type + atomic LoadState · Load(context) / Unload()</text>

  <rect x="570" y="970" width="210" height="91" rx="4" class="green"/>
  <text x="586" y="999" class="label">Scene</text>
  <text x="586" y="1027" class="code">ecs::World</text>
  <text x="586" y="1051" class="small">State + asset references</text>
  <path d="M784 1009H826" class="own"/>
  <rect x="830" y="970" width="190" height="91" rx="4" class="green"/>
  <text x="846" y="999" class="label">Mesh</text>
  <text x="846" y="1027" class="code">SubMesh[]</text>
  <text x="846" y="1051" class="small">Shared geometry</text>
  <path d="M1024 1009H1066" class="own"/>
  <rect x="1070" y="970" width="210" height="91" rx="4" class="green"/>
  <text x="1086" y="999" class="code">VertexArray</text>
  <text x="1086" y="1027" class="code">IndexArray</text>
  <text x="1086" y="1051" class="small">CPU data + GPU buffer</text>

  <path d="M675 1065V1101" class="own"/>
  <rect x="570" y="1105" width="210" height="86" rx="4" class="green"/>
  <text x="586" y="1136" class="code">CameraComponent</text>
  <text x="586" y="1168" class="mini">LightComponent</text>
  <path d="M925 1065V1101" class="own"/>
  <text x="941" y="1091" class="small">SubMesh.material</text>
  <rect x="830" y="1105" width="450" height="91" rx="4" class="green"/>
  <text x="846" y="1136" class="label">Material</text>
  <text x="846" y="1163" class="code">parameter state + fixed passes</text>
  <text x="846" y="1186" class="small">Pass: contract / pipeline / bindings / material_data</text>
  <path d="M924 1200V1247" class="own"/>
  <text x="938" y="1231" class="small">Texture refs</text>
  <path d="M1172 1200V1247" class="own"/>
  <text x="1190" y="1231" class="small">Pass owns</text>
  <rect x="830" y="1251" width="190" height="100" rx="4" class="green"/>
  <text x="846" y="1283" class="label">Texture</text>
  <text x="846" y="1312" class="small">CPU ImageData</text>
  <text x="846" y="1337" class="small">GPU Texture / View</text>
  <rect x="1054" y="1251" width="226" height="100" rx="4" class="green"/>
  <text x="1070" y="1283" class="code">RenderPipeline</text>
  <path d="M1081 1294V1306" class="own"/>
  <text x="1092" y="1323" class="code">Shader[]</text>
  <text x="1070" y="1344" class="small">Fixed desc + GPU state</text>
  <text x="570" y="1229" class="small">Entity material overrides</text>
  <text x="570" y="1258" class="mini">Transform</text>
  <text x="570" y="1286" class="mini">RelationShip / MetaInfo</text>
  <text x="570" y="1315" class="small">World::Update(JobSystem)</text>
  <text x="570" y="1380" class="small">Green arrows: ownership. ComputePipeline also owns a Shader (separate branch).</text>
  <path d="M496 1168H528V1009H566" class="arrow"/>

  <!-- Consumers are above the asset layer in dependency direction. -->
  <rect x="1354" y="807" width="510" height="618" rx="10" class="panel"/>
  <text x="1378" y="843" class="section">03   render / Resource Consumers</text>
  <rect x="1378" y="861" width="462" height="129" rx="5" class="purple"/>
  <text x="1398" y="895" class="label">Renderer / Editor Preview</text>
  <text x="1398" y="927" class="body">Traverse Scene entities; use Mesh and Material</text>
  <text x="1398" y="958" class="small">Call Load(context); cache resources for drawing</text>
  <path d="M1609 994V1033" class="arrow"/>
  <rect x="1378" y="1037" width="462" height="152" rx="5" class="purple"/>
  <text x="1398" y="1071" class="label">MaterialPass / Binding Contract</text>
  <text x="1398" y="1103" class="code">FindPass(pass_contract)</text>
  <text x="1398" y="1135" class="body">bindings define the material_data packing order</text>
  <text x="1398" y="1167" class="small">Skip missing contracts; a MaterialPass is binding data</text>
  <path d="M1350 1135H1284" class="arrow"/>
  <path d="M1609 1193V1233" class="arrow"/>
  <rect x="1378" y="1237" width="462" height="162" rx="5" class="purple"/>
  <text x="1398" y="1271" class="label">gfx / GPU Resource Creation</text>
  <text x="1398" y="1303" class="body">Buffers / Textures / Shaders / Pipelines</text>
  <text x="1398" y="1335" class="small">gfx::ShaderCompiler handles compilation and reflection</text>
  <text x="1398" y="1367" class="small">Pack material_data at runtime for the active backend</text>

  <!-- Foundation and resource residency are intentionally separate concerns. -->
  <text x="56" y="1474" class="section">04   Service Composition and Resource Lifecycle</text>
  <rect x="56" y="1494" width="884" height="232" rx="8" class="panel"/>
  <text x="80" y="1528" class="label">Runtime / App / Plugin Assembly</text>
  <text x="80" y="1563" class="code">IOService + JobSystem → AssetService</text>
  <text x="80" y="1594" class="small">AssetService injects texture I/O and job submission; asset does not depend on engine.</text>
  <text x="80" y="1630" class="code">Device + Queues + Bindings + ShaderCompiler</text>
  <path d="M91 1642V1662H122" class="inject"/>
  <text x="132" y="1669" class="code">ResourceLoadContext → Resource::Load()</text>
  <text x="80" y="1703" class="small">asset depends on core / gfx / ecs / math / utils. Editor and render sit above asset.</text>

  <rect x="970" y="1494" width="894" height="232" rx="8" class="panel"/>
  <text x="994" y="1528" class="label">ResourceLoadState / Async Texture Path</text>
  <rect x="994" y="1563" width="154" height="44" rx="4" class="gray"/>
  <rect x="1206" y="1563" width="154" height="44" rx="4" class="orange"/>
  <rect x="1440" y="1563" width="154" height="44" rx="4" class="blue"/>
  <rect x="1686" y="1563" width="154" height="44" rx="4" class="green"/>
  <text x="1071" y="1592" class="code" text-anchor="middle">Unloaded</text>
  <text x="1283" y="1592" class="code" text-anchor="middle">Loading</text>
  <text x="1517" y="1592" class="code" text-anchor="middle">Staged</text>
  <text x="1763" y="1592" class="code" text-anchor="middle">Loaded</text>
  <path d="M1152 1585H1202" class="arrow"/><path d="M1364 1585H1436" class="arrow"/><path d="M1598 1585H1682" class="arrow"/>
  <text x="1177" y="1553" class="small" text-anchor="middle">Load</text>
  <text x="1400" y="1553" class="small" text-anchor="middle">Decoded</text>
  <text x="1640" y="1553" class="small" text-anchor="middle">Load / Upload</text>
  <path d="M1283 1611V1634H1376" class="arrow"/>
  <text x="1390" y="1641" class="small">Failed (decode error)</text>
  <text x="994" y="1673" class="small">Decode on workers; create GPU resources on the render thread; use placeholders while waiting.</text>
  <text x="994" y="1703" class="small">Sync resources finish in Load. Unload releases GPU residency and retains acquired CPU data.</text>

  <rect x="56" y="1746" width="1808" height="80" rx="7" fill="#fff4e6" stroke="#e5c49d"/>
  <text x="80" y="1777" class="body"><tspan font-weight="700">Implementation status: </tspan>Authoring APIs exist; no interactive editor or Play mode. Hosts integrate material compilation and persist cooked buffers.</text>
  <text x="80" y="1807" class="body"><tspan font-weight="700">Unload coordination: </tspan>UnloadScene cascades to meshes, materials and pipelines. Shared textures are managed separately; callers invalidate renderer caches.</text>
  <path d="M56 1848H1864" stroke="#d7dfe7"/>
  <text x="56" y="1876" class="small">Based on current editor / asset / engine / render code. Dashed arrows: injected extensions or services.</text>
  <text x="1864" y="1876" class="small" text-anchor="end">Companion: cooked_asset_layout.svg</text>
</svg>
