<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">USD 材质与 Hitagi 材质设计对比</title>
  <desc id="desc">对比 USD 材质描述、当前导入映射和 Hitagi 运行时材质资源。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 34px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 16px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #5b6475; }
      .lane-title { font: 700 20px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .node-title { font: 700 17px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .node-text { font: 400 14px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #4b5565; }
      .small { font: 400 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #4b5565; }
      .tag { font: 700 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #ffffff; }
      .table-head { font: 700 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .table-cell { font: 400 14px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #344054; }
      .panel { stroke-width: 2; rx: 18; }
      .node { fill: #ffffff; stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .arrow { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .muted-arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 7; }
    </style>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#101828" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#3b6fb6"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#cc7a14"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#20895a"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#667085"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1080"/>
  <text class="title" x="800" y="58" text-anchor="middle">USD 材质与 Hitagi 材质设计对比</text>
  <text class="subtitle" x="800" y="88" text-anchor="middle">USD 负责材质描述与交换；Hitagi 负责运行时 shader、pipeline、参数和纹理绑定。</text>

  <rect class="panel" x="55" y="130" width="455" height="665" fill="#eaf2ff" stroke="#6f9bd8" rx="18"/>
  <rect x="55" y="130" width="455" height="58" fill="#cfe0ff" rx="18"/>
  <text class="lane-title" x="282" y="166" text-anchor="middle">USD：材质描述 / 资产交换</text>

  <rect class="panel" x="572" y="130" width="455" height="665" fill="#fff7e8" stroke="#e4a64c" rx="18"/>
  <rect x="572" y="130" width="455" height="58" fill="#ffe2b1" rx="18"/>
  <text class="lane-title" x="800" y="166" text-anchor="middle">当前导入器：近似映射</text>

  <rect class="panel" x="1090" y="130" width="455" height="665" fill="#ebfbf2" stroke="#55b77f" rx="18"/>
  <rect x="1090" y="130" width="455" height="58" fill="#c9f3d9" rx="18"/>
  <text class="lane-title" x="1318" y="166" text-anchor="middle">Hitagi：运行时渲染资源</text>

  <g>
    <rect class="node" x="135" y="225" width="295" height="72" stroke="#3b6fb6"/>
    <text class="node-title" x="282" y="253" text-anchor="middle">UsdGeomMesh</text>
    <text class="node-text" x="282" y="276" text-anchor="middle">几何 prim，材质绑定独立存在</text>

    <rect class="node" x="135" y="340" width="295" height="78" stroke="#3b6fb6"/>
    <text class="node-title" x="282" y="370" text-anchor="middle">UsdShadeMaterialBindingAPI</text>
    <text class="node-text" x="282" y="394" text-anchor="middle">查询 bound material</text>

    <rect class="node" x="135" y="462" width="295" height="82" stroke="#3b6fb6" fill="#f8fbff"/>
    <text class="node-title" x="282" y="493" text-anchor="middle">UsdShadeMaterial</text>
    <text class="node-text" x="282" y="517" text-anchor="middle">可组合、可覆盖的 scene prim</text>

    <rect class="node" x="135" y="590" width="295" height="82" stroke="#3b6fb6"/>
    <text class="node-title" x="282" y="620" text-anchor="middle">UsdShadeShader / UsdUVTexture</text>
    <text class="node-text" x="282" y="645" text-anchor="middle">shader input、纹理节点、连接关系</text>
  </g>

  <path class="arrow" d="M282 297 L282 332" stroke="#3b6fb6" marker-end="url(#arrow-blue)"/>
  <path class="arrow" d="M282 418 L282 454" stroke="#3b6fb6" marker-end="url(#arrow-blue)"/>
  <path class="arrow" d="M282 544 L282 582" stroke="#3b6fb6" marker-end="url(#arrow-blue)"/>

  <g>
    <rect class="node" x="655" y="217" width="290" height="76" stroke="#cc7a14"/>
    <text class="node-title" x="800" y="247" text-anchor="middle">1. 打开 USD stage</text>
    <text class="node-text" x="800" y="271" text-anchor="middle">遍历 prim，构建 scene hierarchy</text>

    <rect class="node" x="655" y="334" width="290" height="82" stroke="#cc7a14"/>
    <text class="node-title" x="800" y="365" text-anchor="middle">2. 查询材质绑定</text>
    <text class="node-text" x="800" y="389" text-anchor="middle">ComputeBoundMaterial</text>

    <rect class="node" x="635" y="459" width="330" height="86" stroke="#cc7a14"/>
    <text class="node-title" x="800" y="490" text-anchor="middle">3. 读取 universal surface</text>
    <text class="node-text" x="800" y="515" text-anchor="middle">只处理支持的 shader input</text>

    <rect class="node" x="635" y="590" width="330" height="86" stroke="#cc7a14"/>
    <text class="node-title" x="800" y="620" text-anchor="middle">4. 解析纹理连接</text>
    <text class="node-text" x="800" y="645" text-anchor="middle">Asset resolver → 解码 → Texture</text>

    <rect class="node" x="635" y="710" width="330" height="62" stroke="#cc7a14" fill="#fff1d4"/>
    <text class="node-title" x="800" y="736" text-anchor="middle">5. 压平成 Phong MaterialInstance</text>
    <text class="node-text" x="800" y="758" text-anchor="middle">不保留完整 USD shader graph</text>
  </g>

  <path class="arrow" d="M800 293 L800 326" stroke="#cc7a14" marker-end="url(#arrow-orange)"/>
  <path class="arrow" d="M800 416 L800 451" stroke="#cc7a14" marker-end="url(#arrow-orange)"/>
  <path class="arrow" d="M800 545 L800 582" stroke="#cc7a14" marker-end="url(#arrow-orange)"/>
  <path class="arrow" d="M800 676 L800 702" stroke="#cc7a14" marker-end="url(#arrow-orange)"/>

  <g>
    <rect class="node" x="1170" y="225" width="295" height="72" stroke="#20895a"/>
    <text class="node-title" x="1318" y="253" text-anchor="middle">Mesh::SubMesh</text>
    <text class="node-text" x="1318" y="276" text-anchor="middle">持有 material_instance</text>

    <rect class="node" x="1170" y="340" width="295" height="82" stroke="#20895a" fill="#f8fffb"/>
    <text class="node-title" x="1318" y="371" text-anchor="middle">MaterialInstance</text>
    <text class="node-text" x="1318" y="395" text-anchor="middle">保存本次使用的参数覆盖</text>

    <rect class="node" x="1170" y="462" width="295" height="82" stroke="#20895a"/>
    <text class="node-title" x="1318" y="493" text-anchor="middle">typed parameters</text>
    <text class="node-text" x="1318" y="517" text-anchor="middle">diffuse / roughness / texture slots</text>

    <rect class="node" x="1170" y="590" width="295" height="82" stroke="#20895a"/>
    <text class="node-title" x="1318" y="620" text-anchor="middle">Material: Phong</text>
    <text class="node-text" x="1318" y="645" text-anchor="middle">shader + pipeline + default params</text>

    <rect class="node" x="1170" y="710" width="295" height="62" stroke="#20895a"/>
    <text class="node-title" x="1318" y="737" text-anchor="middle">Renderer</text>
    <text class="node-text" x="1318" y="758" text-anchor="middle">constant buffer + texture binding</text>
  </g>

  <path class="arrow" d="M1318 297 L1318 332" stroke="#20895a" marker-end="url(#arrow-green)"/>
  <path class="arrow" d="M1318 422 L1318 454" stroke="#20895a" marker-end="url(#arrow-green)"/>
  <path class="arrow" d="M1318 544 L1318 582" stroke="#20895a" marker-end="url(#arrow-green)"/>
  <path class="arrow" d="M1318 672 L1318 702" stroke="#20895a" marker-end="url(#arrow-green)"/>

  <path class="arrow" d="M430 503 C505 503 552 375 647 375" stroke="#667085" marker-end="url(#arrow-gray)"/>
  <rect x="472" y="418" width="150" height="26" rx="13" fill="#ffffff" stroke="#d0d5dd"/>
  <text class="small" x="547" y="436" text-anchor="middle">材质绑定查询</text>

  <path class="arrow" d="M965 741 C1050 741 1075 381 1162 381" stroke="#667085" marker-end="url(#arrow-gray)"/>
  <rect x="1018" y="538" width="150" height="26" rx="13" fill="#ffffff" stroke="#d0d5dd"/>
  <text class="small" x="1093" y="556" text-anchor="middle">SetMaterial / SetParameter</text>

  <g>
    <rect x="70" y="830" width="690" height="190" rx="18" fill="#ffffff" stroke="#d8dee9" filter="url(#shadow)"/>
    <text class="lane-title" x="105" y="866">当前支持的参数映射</text>
    <rect x="105" y="890" width="180" height="30" rx="15" fill="#3b6fb6"/>
    <text class="tag" x="195" y="910" text-anchor="middle">USD input</text>
    <rect x="545" y="890" width="180" height="30" rx="15" fill="#20895a"/>
    <text class="tag" x="635" y="910" text-anchor="middle">Hitagi parameter</text>
    <text class="table-cell" x="105" y="950">diffuseColor / specularColor / emissiveColor</text>
    <text class="table-cell" x="545" y="950">diffuse / specular / emissive</text>
    <text class="table-cell" x="105" y="980">roughness / metallic / occlusion</text>
    <text class="table-cell" x="545" y="980">roughness / metallic / occlusion</text>
    <text class="table-cell" x="105" y="1010">UsdUVTexture connections</text>
    <text class="table-cell" x="545" y="1010">*_texture 参数</text>
    <path class="muted-arrow" d="M300 944 L525 944" stroke="#667085" marker-end="url(#arrow-gray)"/>
    <path class="muted-arrow" d="M300 974 L525 974" stroke="#667085" marker-end="url(#arrow-gray)"/>
    <path class="muted-arrow" d="M300 1004 L525 1004" stroke="#667085" marker-end="url(#arrow-gray)"/>
  </g>

  <g>
    <rect x="835" y="830" width="695" height="190" rx="18" fill="#fbf7ff" stroke="#c6b4ff" filter="url(#shadow)"/>
    <text class="lane-title" x="870" y="866">推荐演进：新增 PBR 内置材质</text>
    <rect class="node" x="880" y="900" width="145" height="66" stroke="#7c3aed"/>
    <text class="node-title" x="952" y="928" text-anchor="middle">USD Preview</text>
    <text class="node-text" x="952" y="950" text-anchor="middle">Surface</text>
    <rect class="node" x="1080" y="900" width="145" height="66" stroke="#7c3aed"/>
    <text class="node-title" x="1152" y="928" text-anchor="middle">Importer</text>
    <text class="node-text" x="1152" y="950" text-anchor="middle">参数映射</text>
    <rect class="node" x="1280" y="900" width="190" height="66" stroke="#7c3aed"/>
    <text class="node-title" x="1375" y="928" text-anchor="middle">Material: PBR</text>
    <text class="node-text" x="1375" y="950" text-anchor="middle">baseColor / roughness / normal</text>
    <path class="arrow" d="M1025 933 L1072 933" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
    <path class="arrow" d="M1225 933 L1272 933" stroke="#7c3aed" marker-end="url(#arrow-purple)"/>
  </g>
</svg>
